<details class="panel support"><summary id="theory-summary"></summary><div id="theory"></div></details></main><footer><span id="footer"></span><span>c = 299.792458 m/μs</span></footer><pre id="physics-test-results" hidden></pre><noscript>Enable JavaScript to run this offline simulator. 请启用 JavaScript。</noscript></div><script>
'use strict';
/* A. Physical constants and shared state -----------------------------------
   Units everywhere: meters and microseconds. Playback seconds are separate.
   The origin is the coincidence of train and station centers at t = t' = 0. */
const C = 299.792458;
const PROPER_LENGTH = 300;
const MIRROR_SEPARATION = 60;
const BASE_RATE = 0.1;
const EPSILON = 1e-10;
const EXPERIMENTS = {
  clock: {number:'01', title:'Time Dilation: The Light Clock'},
  length: {number:'02', title:'Length Contraction: Measuring a Moving Train'},
  lightning: {number:'03', title:'Relativity of Simultaneity: The Lightning Experiment'}
};
function initialState() {
  return {experiment:'clock', frame:'ground', beta:0.8,
    speed:1, time:0, clockProgress:0, playing:false, measurement:null, inspectedEvent:'A'};
}
let state = initialState();
let animationRequest = null;
let playbackAnchor = null;
const format = (number, digits=4) => (Math.abs(number) < 0.5 * Math.pow(10,-digits) ? 0 : number).toFixed(digits);
const signed = (number, digits=2) => (number > 0 ? '+' : '') + format(number,digits);
const clamp = (number,min,max) => Math.min(max,Math.max(min,number));

/* B. Lorentz transformations ----------------------------------------------- */
function lorentzFactor(beta) {
  if (!Number.isFinite(beta) || Math.abs(beta) >= 1) throw new RangeError('Velocity must satisfy |β| < 1.');
  return 1 / Math.sqrt(1 - beta * beta);
}
function groundToTrain(t,x,beta) {
  const gamma = lorentzFactor(beta), v = beta * C;
  return {t:gamma*(t-v*x/(C*C)), x:gamma*(x-v*t)};
}
function trainToGround(tPrime,xPrime,beta) {
  const gamma = lorentzFactor(beta), v = beta*C;
  return {t:gamma*(tPrime+v*xPrime/(C*C)), x:gamma*(xPrime+v*tPrime)};
}
function inFrame(event,frame,beta) {
  const coordinates = frame === 'ground' ? {t:event.t,x:event.x} : groundToTrain(event.t,event.x,beta);
  return {...event,...coordinates};
}
function dilatedTime(properTime,beta) {return lorentzFactor(beta)*properTime;}
function contractedLength(properLength,beta) {return properLength/lorentzFactor(beta);}
function intervalSquared(a,b) {return C*C*(b.t-a.t)**2-(b.x-a.x)**2;}

/* C. Light Clock physics ---------------------------------------------------
   Emission/reflection/return are defined in the rest frame, converted once to
   canonical ground-frame events. y is unchanged by a boost along x.
   In S: vx = v, |vy| = c/γ, so sqrt(vx²+vy²) = c. */
function lightClockEvents(beta) {
  return [
    {id:'emission',type:'emission',t:0,x:0,y:0},
    {id:'reflection',type:'reflection',t:MIRROR_SEPARATION/C,x:0,y:MIRROR_SEPARATION},
    {id:'return',type:'return',t:2*MIRROR_SEPARATION/C,x:0,y:0}
  ].map(event => ({...event,...trainToGround(event.t,event.x,beta)}));
}
function lightClockPosition(time,frame,beta) {
  const events = lightClockEvents(beta).map(event=>inFrame(event,frame,beta));
  const boundedTime = clamp(time,events[0].t,events[2].t);
  const from = boundedTime <= events[1].t ? events[0] : events[1];
  const to = boundedTime <= events[1].t ? events[1] : events[2];
  const fraction = (boundedTime-from.t)/(to.t-from.t);
  return {t:boundedTime,x:from.x+(to.x-from.x)*fraction,y:from.y+(to.y-from.y)*fraction};
}
function mirrorPosition(time,frame,beta,upper=false) {
  return {t:time,x:frame==='ground'?beta*C*time:0,y:upper?MIRROR_SEPARATION:0};
}

/* Dual-frame synchronization: p identifies ONE photon event on its worldline.
   It is a visualization parameter, NOT a universal coordinate time. We derive
   both frame times from the same emission/return events before sampling the
   existing light-clock trajectory. No second clock or animation loop exists. */
function lightClockPathLength(events, time=events[2].t) {
  let distance=0;
  for(let index=0;index<events.length-1;index++) {
    const from=events[index], to=events[index+1];
    const fraction=clamp((time-from.t)/(to.t-from.t),0,1);
    distance+=fraction*Math.hypot(to.x-from.x,to.y-from.y);
  }
  return distance;
}
function dualClockSnapshot(progress,beta) {
  const p=clamp(progress,0,1), canonical=lightClockEvents(beta);
  const snapshot={progress:p};
  for(const frame of ['train','ground']) {
    const events=canonical.map(event=>inFrame(event,frame,beta));
    const duration=events[2].t-events[0].t;
    const time=events[0].t+p*duration;
    snapshot[frame]={events,duration,time,photon:lightClockPosition(time,frame,beta),
      distance:lightClockPathLength(events,time),totalDistance:lightClockPathLength(events)};
  }
  return snapshot;
}

/* D. Length Contraction physics --------------------------------------------
   A length is a DIFFERENCE of simultaneous positions in the measuring frame.
   Transforming a ground-simultaneous pair does not create a train-simultaneous
   measurement. Each selected frame constructs its own constant-time slice. */
function measureTrain(time,frame,beta) {
  const length = frame === 'ground' ? contractedLength(PROPER_LENGTH,beta) : PROPER_LENGTH;
  const center = frame === 'ground' ? beta*C*time : 0;
  const rear = {t:time,x:center-length/2};
  const front = {t:time,x:center+length/2};
  const canonical = point => frame==='ground' ? {...point} : trainToGround(point.t,point.x,beta);
  return {time,frame,rear,front,length,events:[
    {id:'rear-measurement',type:'measurement',...canonical(rear)},
    {id:'front-measurement',type:'measurement',...canonical(front)}
  ]};
}

/* E. Simultaneity physics ---------------------------------------------------
   L below is the CONTRACTED ground length, never L0. At t=0 the lightning
   strikes stationary ground locations that coincide with the train endpoints.
   Reception solves x_light(t) = u*t for each observer, then transforms the
   resulting SAME reception event to the selected frame. */
function lightningEvents(beta) {
  const length = contractedLength(PROPER_LENGTH,beta);
  return [{id:'A',type:'lightning',t:0,x:-length/2},{id:'B',type:'lightning',t:0,x:length/2}];
}
function receptionEvent(event,observer,beta) {
  const u = observer === 'ground' ? 0 : beta*C;
  const direction = event.x < 0 ? 1 : -1;
  const t = (direction*C*event.t-event.x)/(direction*C-u);
  return {id:event.id+'-'+observer,type:'reception',source:event.id,observer,t,x:u*t};
}
function receptionEvents(beta) {
  return lightningEvents(beta).flatMap(event => ['ground','train'].map(observer=>receptionEvent(event,observer,beta)));
}
function photonPosition(event,time,direction) {
  return time < event.t ? null : {t:time,x:event.x+direction*C*(time-event.t)};
}
function observerPosition(time,observer,frame,beta) {
  if (frame==='ground') return observer==='ground'?0:beta*C*time;
  return observer==='train'?0:-beta*C*time;
}
function timeBounds(current) {
  if(current.experiment==='clock') {
    const events = lightClockEvents(current.beta).map(event=>inFrame(event,current.frame,current.beta));
    return {start:0,end:events[2].t};
  }
  if(current.experiment==='length') return {start:0,end:1};
  const emissions = lightningEvents(current.beta).map(event=>inFrame(event,current.frame,current.beta));
  const receptions = receptionEvents(current.beta).map(event=>inFrame(event,current.frame,current.beta));
  return {start:Math.min(...emissions.map(event=>event.t))-0.12,end:Math.max(...receptions.map(event=>event.t))+0.12};
}

const svgText = (x,y,text,color='#aaaaaa',size=12,anchor='middle') => `<text x="${x}" y="${y}" fill="${color}" font-size="${size}" text-anchor="${anchor}">${text}</text>`;
const svgLine = (x1,y1,x2,y2,color='#707070',width=1,extra='') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" ${extra}/>`;
function dualClockViewport(beta,frame) {
  const ground=dualClockSnapshot(1,beta).ground;
  const travel=ground.photon.x, length=contractedLength(PROPER_LENGTH,beta);
  // Equal spatial scale in the two views; cameras are fixed for the entire run.
  const scale=Math.min(1.3,440/(Math.max(PROPER_LENGTH,length+travel)+60));
  const center=frame==='train'?0:travel/2;
  return {scale,x:value=>260+(value-center)*scale,y:value=>173-(value+12)*scale};
}
function coordinateTimeAt(anchor,wallNow) {
  return anchor.time + Math.max(0,wallNow-anchor.wall)/1000*BASE_RATE*anchor.speed;
}
function samplePlayback(current,anchor,wallNow) {
  if(current.experiment!=='clock')return {time:Math.min(timeBounds(current).end,coordinateTimeAt(anchor,wallNow))};
  const duration=dualClockSnapshot(1,current.beta)[current.frame].duration;
  const progress=clamp(anchor.progress+Math.max(0,wallNow-anchor.wall)/1000*BASE_RATE*anchor.speed/duration,0,1);
  // The selected frame defines playback rate only. Both views always sample p.
  return {clockProgress:progress,time:dualClockSnapshot(progress,current.beta)[current.frame].time};
}
function resetState(current,patch={}) {
  const next={...current,...patch,playing:false,measurement:null,clockProgress:0};
  next.time=timeBounds(next).start;
  return next;
}
function selectFrame(current,frame) {return resetState(current,{frame});}
function selectVelocity(current,beta) {
  return resetState(current,{beta});
}
function spacetimeData(current) {
  const beta=current.beta,gamma=lorentzFactor(beta);
  if(current.experiment==='clock') {
    const snapshot=dualClockSnapshot(current.clockProgress,beta);
    return {kind:'clock',snapshot,events:snapshot.ground.events,extent:snapshot.ground.duration*C*1.3};
  }
  if(current.experiment==='length') {
    return {kind:'length',ground:measureTrain(0,'ground',beta),train:measureTrain(0,'train',beta),extent:gamma*PROPER_LENGTH*.7};
  }
  const events=lightningEvents(beta);
  const projections=events.map(event=>{const prime=groundToTrain(event.t,event.x,beta);return trainToGround(prime.t,0,beta);});
  return {kind:'lightning',events,projections,extent:Math.max(180,gamma*PROPER_LENGTH*.7)};
}
function diagramViewport(data) {
  const scale=(data.kind==='clock'?265:150)/data.extent;
  const origin=data.kind==='clock'?{x:65,y:335}:{x:200,y:205};
  return {scale,x:x=>origin.x+x*scale,y:ct=>origin.y-ct*scale,origin};
}
function diagramPoint(view,event){return {x:view.x(event.x),y:view.y(C*event.t)};}
function diagramSegment(view,a,b,color,width=1.3,extra='') {
  return svgLine(view.x(a.x),view.y(C*a.t),view.x(b.x),view.y(C*b.t),color,width,extra);
}
function diagramEvent(view,event,label,color='#dfbc88',dx=9,dy=-8) {
  const p=diagramPoint(view,event);
  return `<circle cx="${p.x}" cy="${p.y}" r="3.6" fill="#202020" stroke="${color}" stroke-width="1.7"/>`+svgText(p.x+dx,p.y+dy,label,color,13,'start');
}
function diagramAxes(data,view,beta) {
  const extent=data.extent,min=data.kind==='clock'?-.1*extent:-extent,max=extent;
  const axis=(x1,ct1,x2,ct2,color,width=1,extra='')=>svgLine(view.x(x1),view.y(ct1),view.x(x2),view.y(ct2),color,width,extra);
  let drawing=axis(min,0,max,0,'#bfbfbf')+axis(0,min,0,max,'#bfbfbf');
  drawing+=svgText(view.x(max)+13,view.y(0)+5,beta===0?'x, x′':'x','#dedede',14);
  drawing+=svgText(view.x(0)-9,view.y(max)-12,beta===0?'ct, ct′':'ct','#dedede',14);
  if(beta>0) {
    drawing+=axis(beta*min,min,beta*max,max,'#91bdb6',1.2);
    drawing+=axis(min,beta*min,max,beta*max,'#91bdb6',1.2);
    drawing+=svgText(view.x(beta*max)+9,view.y(max)+4,'ct′','#a3d8cc',14,'start');
    drawing+=svgText(view.x(max)+8,view.y(beta*max)+4,'x′','#a3d8cc',14,'start');
  }
  const step=extent>500?200:extent>220?100:50;
  for(let q=step;q<max*.96;q+=step) {
    drawing+=axis(q,-extent*.012,q,extent*.012,'#888')+svgText(view.x(q),view.y(0)+18,format(q,0),'#929292',10);
    drawing+=axis(-extent*.012,q,extent*.012,q,'#888')+svgText(view.x(0)-9,view.y(q)+3,format(q,0),'#929292',10,'end');
  }
  drawing+=svgText(view.x(0)-12,view.y(0)+18,'O','#ddd',12);
  // Reference light line represents longitudinal light, not the transverse clock ray.
  if(data.kind==='clock')drawing+=axis(0,0,max,max,'#8f6e64',1,'stroke-dasharray="3 5"')+svgText(view.x(max)-13,view.y(max)+29,'ct = x','#b7998d',11);
  return drawing;
}
/* J. Physics validation tests ----------------------------------------------
   Dependency-free tests use pure functions and local state copies. They never
   move the active simulation or alter the user's controls. Run from console:
   runPhysicsTests(). Results are also returned as a structured object.
   Relative and absolute tolerance are combined for near-zero quantities. */
function runPhysicsTests(log=true) {
  const results=[];
  const near=(actual,expected,tolerance=1e-9)=>{
    if(!Number.isFinite(actual)||Math.abs(actual-expected)>tolerance*Math.max(1,Math.abs(expected)))throw new Error(`Expected ${expected}, received ${actual}`);
  };
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};
  const test=(name,body)=>{try{body();results.push({name,passed:true});}catch(error){results.push({name,passed:false,error:error.message});}};

/* F. Spatial visualization — real 3D vertices projected into inline SVG.
   The orthographic camera never alters physical coordinates or event times.
   x is boosted; y and z are unchanged. This is a coordinate model, not an
   optical image (no retarded-time photography or Terrell rotation). */
let language='en';
try { language=localStorage.getItem('relativity-language')==='zh'?'zh':'en'; } catch {}
const tr=(en,zh)=>language==='zh'?zh:en;
const el=id=>document.getElementById(id);
const camera={yaw:-20,pitch:23};
let lengthStage=1;
let noticeKey='ready';

function frameName(frame=state.frame){if(state.experiment==='clock')return frame==='ground'?tr('Ground frame','地面参考系'):tr('Train frame','列车参考系');return frame==='ground'?tr('Station frame','空间站参考系'):tr('Ship frame','飞船参考系');}
function projected(point,view) {
  const a=camera.yaw*Math.PI/180,b=camera.pitch*Math.PI/180;
  const x=point[0]-view.center,y=point[1],z=point[2];
  const rx=x*Math.cos(a)+z*Math.sin(a),rz=-x*Math.sin(a)+z*Math.cos(a);
  return {x:480+rx*view.scale,y:248-(y*Math.cos(b)-rz*Math.sin(b))*view.scale,depth:y*Math.sin(b)+rz*Math.cos(b)};
}
function spatialView() {
  const bounds=timeBounds(state),len=state.frame==='ground'?contractedLength(300,state.beta):300;
  const positions=[bounds.start,bounds.end].flatMap(t=>[observerPosition(t,'train',state.frame,state.beta)-len/2,observerPosition(t,'train',state.frame,state.beta)+len/2,observerPosition(t,'ground',state.frame,state.beta)]);
  const lo=Math.min(...positions),hi=Math.max(...positions);

function line3(a,b,view,color='#505953',width=1,extra='') {const p=projected(a,view),q=projected(b,view);return svgLine(p.x,p.y,q.x,q.y,color,width,extra);}

function poly3(points,view,fill,stroke='#899c92',opacity=1) {return `<polygon points="${points.map(p=>{const q=projected(p,view);return `${q.x},${q.y}`;}).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="1" opacity="${opacity}"/>`;}
function shipGeometry(center,length) {
  // Every vertex's x coordinate scales with measured longitudinal extent;
  // transverse width and height remain exactly constant under the boost.
  const profiles=[[-.5,14],[-.38,27],[.30,27],[.5,0]];
  return profiles.map(([u,r])=>Array.from({length:8},(_,j)=>{const a=j*Math.PI/4;return [center+u*length,r*Math.cos(a),r*Math.sin(a)];}));
}
function shipMesh(center,length,view,ghost=false) {
  const rings=shipGeometry(center,length),faces=[];
  for(let i=0;i<rings.length-1;i++)for(let j=0;j<8;j++){
    const pts=[rings[i][j],rings[i][(j+1)%8],rings[i+1][(j+1)%8],rings[i+1][j]];
    faces.push({pts,depth:pts.reduce((s,p)=>s+projected(p,view).depth,0)/4,j});
  }
  faces.sort((a,b)=>a.depth-b.depth);
  let html=faces.map(f=>poly3(f.pts,view,ghost?'none':['#3d5049','#435a51','#4c645a','#536e63','#42584e','#34473e','#304039','#384b42'][f.j],ghost?'#7e8580':'#829b8e',ghost?.35:.94)).join('');
  if(!ghost){

    html+=line3([center-length/2,0,-10],[center-length/2,0,10],view,'#d2b990',4);
  }
  return html;
}
function dimension(a,b,y,z,label,view,color) {

   return `<tr class="${e.id===state.inspectedEvent?'selected':''}"><td>${label}</td><td>${signed(e.t,4)}</td><td>${signed(e.x,2)}</td><td>${signed(p.t,4)}</td><td>${signed(p.x,2)}</td><td>${state.time+EPSILON>=current.t?tr('Occurred','已发生'):tr('Pending','待发生')}</td></tr>`;
  }).join('')+'</tbody></table>';
 }
 el('event-data').innerHTML=html;
 el('event-buttons').innerHTML=state.experiment==='lightning'?['A','B'].map(id=>`<button data-inspect="${id}" aria-pressed="${state.inspectedEvent===id}">${tr('Inspect emission','查看发射')} ${id}</button>`).join(''):'';
 el('event-note').textContent=state.experiment==='length'?tr('The two records are generated automatically at the same selected-frame coordinate time. Their times in the other frame need not agree.','两个端点记录由系统自动在当前参考系的同一坐标时刻生成；它们在另一参考系中的时间不必相同。'):tr('Each row is one physical event with two coordinate descriptions. Reception times are coordinate times, not the moving observer’s proper clock readings.','每行是同一个物理事件的两套坐标描述。接收时间是坐标时间，不是运动观察者自身时钟的固有时读数。');
}
function renderTheory(){
 let common=tr('The origins coincide at t = t′ = 0. Motion is inertial along +x. c = 299.792458 m/μs; L₀ = 300 m; mirror separation d = 60 m. Gravity and acceleration are excluded.','两系原点在 t = t′ = 0 重合。飞船沿 +x 做惯性运动。c = 299.792458 m/μs，L₀ = 300 m，两镜间距 d = 60 m。不模拟引力与加速。');
 if(state.experiment==='clock')common=common.replace('ship','train').replace('飞船','列车');
 const text=state.experiment==='clock'?tr('The pulse travels at c in both frames. On the train it travels 2d in one tick; in the ground frame its path is longer by γ. The transverse mirror separation is unchanged. Playback follows the same photon event in both views, with distinct time readings.','光在两系中都以 c 传播。列车系一个周期光程为 2d；地面系光程为其 γ 倍。横向两镜间距不变。双图播放跟踪同一个光子事件，两系时间读数不同。'):state.experiment==='length'?tr('Length is the separation of endpoints at the same time in the measuring frame. L = L₀/γ applies only along motion. It is not material compression. The wire outline is a rest-length comparison, not a second physical ship. Different reference frames use different simultaneous event pairs.','长度是在测量参考系中同一时刻两端的位置差。L = L₀/γ 仅适用于运动方向，并非材料被压缩。线框为固有长度参照，不是第二艘真实飞船。不同参考系采用不同的同时事件对。'):tr('The flashes occur at station time t = 0 and x = ±L/2, where L = L₀/γ. Their ship coordinates come from the Lorentz transformation, not simultaneous endpoint samples. Expanding rings are two great-circle sections of spherical light fronts. A reception occurs where the light meets an observer’s worldline.','闪光发生在空间站时刻 t = 0、位置 x = ±L/2，其中 L = L₀/γ。飞船系事件坐标由洛伦兹变换得到，并非同时采样的两端。扩展圆环是球形光波面的两个大圆截面。光与观察者世界线相交时发生接收事件。');
 el('theory').innerHTML=`<p>${text}</p><div class="equation">γ = 1 / √(1 − β²)<br>x′ = γ(x − vt) &nbsp; · &nbsp; t′ = γ(t − vx/c²)<br>x = γ(x′ + vt′) &nbsp; · &nbsp; t = γ(t′ + vx′/c²)</div><p>${common}</p><p>${tr('The rotatable 3D model uses orthographic projection. It shows frame-coordinate geometry, not a photograph: light travel-time optical distortions are not modeled. Observer labels are offset; their stems mark the physical x positions. Changing viewpoint never changes physics.','可旋转的三维模型采用正交投影，展示参考系中的坐标几何，不是照片；不模拟光传播延迟造成的视觉畸变。观察者标签错位排布，连接线标示真实 x 位置。改变观看角度不会改变物理结果。')}</p>`;
}
function renderUI(){
 document.documentElement.lang=language==='zh'?'zh-CN':'en';document.title=tr('Relativity Lab · Modern Physics','相对论实验室 · 近代物理');
 const labels={brand:tr('RELATIVITY LAB','相对论实验室'),subtitle:tr('Modern Physics · A visual exploration','近代物理 · 可视化探索'),'velocity-label':tr('Relative velocity β = v/c','相对速度 β = v/c'),'gamma-label':tr('Lorentz factor γ','洛伦兹因子 γ'),'orbit-hint':tr('Drag to orbit · same physics, different view','拖动旋转模型 · 视角改变，物理不变'),'azimuth-label':tr('Orbit','旋转'),'elevation-label':tr('Tilt','俯仰'),'side-view':tr('Side view','正侧视图'),'reset-view':tr('Reset view','重置视角'),'speed-label':tr('Playback','播放速度'),'diagram-title':tr('Spacetime diagram','时空图'),'axis-key':tr('x → position · ct ↑ time × c. Both in meters, equal scale. White axes: station S. Green axes: ship S′.','x → 位置 · ct ↑ 时间 × c。均以米计，等比例。白轴：空间站 S；绿轴：飞船 S′。'),'event-summary':tr('Event records · coordinates in both frames','事件记录 · 两系坐标对照'),'theory-summary':tr('Physics & model assumptions','物理原理与模型假设'),footer:tr('Self-contained · Offline · No installation','单文件 · 离线运行 · 无需安装'),play:tr('▶ Play','▶ 播放'),pause:tr('Ⅱ Pause','Ⅱ 暂停'),reset:tr('↺ Reset','↺ 重置')};
 if(state.experiment==='clock')labels['axis-key']=tr('x → position · ct ↑ time × c. Both in meters, equal scale. White axes: ground S. Green axes: train S′.','x → 位置 · ct ↑ 时间 × c。均以米计，等比例。白轴：地面 S；绿轴：列车 S′。');
 Object.entries(labels).forEach(([id,value])=>el(id).textContent=value);
 el('lang-en').setAttribute('aria-pressed',language==='en');el('lang-zh').setAttribute('aria-pressed',language==='zh');
 const names={clock:tr('Time Dilation','时间膨胀'),length:tr('Length Contraction','长度收缩'),lightning:tr('Relativity of Simultaneity','同时性的相对性')};
 document.querySelectorAll('[data-experiment]').forEach((button,i)=>{button.innerHTML=`<small>0${i+1}</small>${names[button.dataset.experiment]}`;button.setAttribute('aria-selected',state.experiment===button.dataset.experiment);button.tabIndex=state.experiment===button.dataset.experiment?0:-1;});
 el('main').setAttribute('aria-labelledby','tab-'+state.experiment);el('title').textContent=names[state.experiment];
 document.querySelectorAll('[data-frame]').forEach(button=>{button.textContent=frameName(button.dataset.frame);button.setAttribute('aria-pressed',button.dataset.frame===state.frame);});
 el('frames').setAttribute('aria-label',tr('Reference frame; changing it resets and pauses playback','参考系；切换后重置并暂停播放'));
 el('velocity-value').textContent=format(state.beta,2)+'c';el('velocity').value=state.beta;el('gamma-value').textContent=format(lorentzFactor(state.beta),3);el('speed').value=state.speed;
 el('scrub').setAttribute('aria-label',tr('Simulation time; drag to replay any moment','模拟时间；拖动回看任意时刻'));
 el('space-scene').toggleAttribute('hidden',state.experiment==='clock');el('view-tools').hidden=state.experiment==='clock';el('clock-grid').hidden=state.experiment!=='clock';
 el('frame-tag').textContent=state.experiment==='clock'?tr('Same events · two clocks','同一组事件 · 两个时钟'):frameName();
 el('scene-foot').textContent=state.experiment==='clock'?tr('Synchronized event progress · compare the time readings, not screen arrival order.','按事件进度同步 · 比较时钟读数，而非屏幕上到达的先后。'):tr('3D coordinate model, not a camera image. Only longitudinal dimensions contract.','三维坐标模型，不是相机图像。仅沿运动方向的尺寸发生收缩。');
 renderTheory();renderLive();
}
function renderLive(){
 if(state.experiment==='clock')el('clock-grid').innerHTML=clockDrawing('train')+clockDrawing('ground');
 else el('space-layer').innerHTML=spaceDrawing();
 const [heading,body]=narration();el('narration').innerHTML=`<strong>${heading}</strong><p>${body}</p>`;el('scene-description').textContent=heading+' '+body;
 drawDiagram();renderStages();renderRecords();
 const bounds=timeBounds(state);el('scrub').value=1000*(state.time-bounds.start)/(bounds.end-bounds.start);
 el('time-label').textContent=`${state.frame==='ground'?'t':'t′'} = ${signed(state.time,4)} μs`;
 el('rate-label').textContent=tr(`${format(BASE_RATE*state.speed,2)} μs / real second`,`${format(BASE_RATE*state.speed,2)} μs / 现实秒`);
 el('play').disabled=state.playing;el('pause').disabled=!state.playing;
 const notices={ready:tr('Press Play, or select a stage to explore the process.','点击播放，或选择阶段查看过程。'),reset:tr('Reset and paused at this frame’s initial time.','已重置到当前参考系的初始时刻，并暂停。'),frame:tr('Reference frame changed. Reset and paused at the new frame’s initial time.','参考系已切换；已重置到新参考系的初始时刻，并暂停。'),velocity:tr('Velocity changed. Physical events recalculated; playback reset and paused.','速度已改变；已重新计算物理事件，重置并暂停播放。'),running:tr('Playing. Pause or drag the timeline to inspect a moment.','正在播放。可暂停或拖动时间轴查看任意时刻。'),paused:tr('Paused. Positions and time are held fixed.','已暂停，位置与时间保持不变。'),complete:tr('Process complete. Press Play to replay.','过程结束。点击播放可重新演示。'),hidden:tr('Paused because the browser tab was hidden.','浏览器标签页不可见，已自动暂停。')};
 if(el('notice').textContent!==notices[noticeKey])el('notice').textContent=notices[noticeKey];
}
/* I. Direct exploration, without quizzes or student measurement tasks. */
function bindInterface(){
 el('lang-en').onclick=()=>setLanguage('en');el('lang-zh').onclick=()=>setLanguage('zh');
 el('play').onclick=play;el('pause').onclick=pause;el('reset').onclick=()=>reset();
 el('velocity').oninput=e=>reset({beta:Number(e.target.value)},'velocity');
 el('speed').onchange=e=>{synchronize(performance.now());state.speed=Number(e.target.value);if(state.playing)playbackAnchor={time:state.time,progress:state.clockProgress,wall:performance.now(),speed:state.speed};renderLive();};
 el('scrub').oninput=e=>{const b=timeBounds(state);seek(b.start+Number(e.target.value)/1000*(b.end-b.start));};
 document.querySelectorAll('[data-frame]').forEach(button=>button.onclick=()=>{if(state.frame!==button.dataset.frame){if(state.experiment==='length')lengthStage=button.dataset.frame==='train'?0:1;reset({frame:button.dataset.frame},'frame');}});
 document.querySelectorAll('[data-experiment]').forEach(button=>button.onclick=()=>{if(state.experiment!==button.dataset.experiment){lengthStage=state.frame==='train'?0:1;reset({experiment:button.dataset.experiment});}});
 document.querySelector('.tabs').onkeydown=e=>{const tabs=[...document.querySelectorAll('[data-experiment]')],i=tabs.indexOf(document.activeElement);if(i<0)return;let j;if(e.key==='ArrowRight')j=(i+1)%3;else if(e.key==='ArrowLeft')j=(i+2)%3;else if(e.key==='Home')j=0;else if(e.key==='End')j=2;else return;e.preventDefault();tabs[j].click();tabs[j].focus();};
 el('stages').onclick=e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.stage!==undefined){lengthStage=Number(button.dataset.stage);reset({frame:lengthStage===0?'train':'ground'},'frame');}else{const i=Number(button.dataset.milestone);seek(milestoneEvents()[i].t);}const updated=el('stages').querySelector(`[${button.dataset.stage!==undefined?'data-stage':'data-milestone'}="${button.dataset.stage??button.dataset.milestone}"]`);updated?.focus();};
 function inspect(id){state.inspectedEvent=id;el('event-details').open=true;renderLive();}
 el('event-buttons').onclick=e=>{const button=e.target.closest('[data-inspect]');if(button){inspect(button.dataset.inspect);el('event-buttons').querySelector(`[data-inspect="${button.dataset.inspect}"]`)?.focus();}};
 el('space-scene').onclick=e=>{const button=e.target.closest('[data-event]');if(button)inspect(button.dataset.event);};
 el('space-scene').onkeydown=e=>{const button=e.target.closest('[data-event]');if(button&&(e.key==='Enter'||e.key===' ')){e.preventDefault();inspect(button.dataset.event);el('space-scene').querySelector(`[data-event="${button.dataset.event}"]`)?.focus();}};
 function setCamera(yaw,pitch){camera.yaw=clamp(yaw,-55,55);camera.pitch=clamp(pitch,0,60);el('azimuth').value=camera.yaw;el('elevation').value=camera.pitch;renderLive();}
 el('azimuth').oninput=e=>setCamera(Number(e.target.value),camera.pitch);el('elevation').oninput=e=>setCamera(camera.yaw,Number(e.target.value));el('side-view').onclick=()=>setCamera(0,0);el('reset-view').onclick=()=>setCamera(-20,23);
 let drag=null;const scene=el('space-scene');scene.onpointerdown=e=>{if(e.target.closest('[data-event]'))return;drag={x:e.clientX,y:e.clientY,yaw:camera.yaw,pitch:camera.pitch};scene.setPointerCapture(e.pointerId);};scene.onpointermove=e=>{if(drag)setCamera(drag.yaw+(e.clientX-drag.x)*.2,drag.pitch+(e.clientY-drag.y)*.2);};scene.onpointerup=scene.onpointercancel=()=>drag=null;
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.playing){pause();noticeKey='hidden';renderLive();}});
}
function setLanguage(value){language=value;try{localStorage.setItem('relativity-language',value);}catch{}renderUI();}
/* K. Bootstrap — physics tests remain console-only. */
bindInterface();renderUI();
const validation=runPhysicsTests(false);el('physics-test-results').textContent=JSON.stringify(validation);if(validation.failed)console.error('Physics validation failed',validation);

</script></body></html>
